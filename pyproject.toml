[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "keelson-connector-safety-supervisor"
version = "0.1.0"
description = "The onboard safety supervisor: emergency_request -> safety_state, the processed-request ledger and the local lockout (keelson protocols/emergency_request.yaml)."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    # EXACT pin, never a path or a range. The types (EmergencyRequest, SafetyState,
    # SafetyRequestResult) exist only on keelson PR #332, unmerged. This is keelson's
    # `experimental` channel: 0.6.0-experimental.21 (PyPI's spelling 0.6.0.dev21) = dev + the
    # open PRs, #332 at d7d9512, tracked by crowsnest-dev #82. An experimental tree stops existing
    # the moment any of its PRs lands, so repin to the -pre.N that carries #332 once it merges.
    "keelson==0.6.0.dev21",
]

[project.optional-dependencies]
# The SITL drone's key switch and stop over the supervisor's OWN MAVLink link (--sim-mavlink, test profile
# only; crowsnest-dev#268). Imported only when that flag is given, so an operational image never needs it.
sitl = ["pymavlink==2.4.47"]
dev = ["pytest==8.3.4", "ruff==0.14.11", "pymavlink==2.4.47"]

[tool.setuptools]
packages = ["safety_supervisor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["e2e: end-to-end test that runs the CLI against an isolated in-process Zenoh peer"]

[tool.ruff]
line-length = 140
